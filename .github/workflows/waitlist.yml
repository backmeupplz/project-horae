name: Waitlist tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  waitlist-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s waitlist -v
      - run: node --test tests/waitlist.test.cjs
      - run: git diff --check
